<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1117">
  <title>LuminaStudy AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0F1117; color: #F8FAFC;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    .logo {
      width: 82px; height: 82px; margin: 0 auto 20px; border-radius: 26px;
      display: grid; place-items: center; font-size: 42px;
      background: linear-gradient(135deg, #4285F4, #8B5CF6, #06B6D4);
      box-shadow: 0 0 42px rgba(99, 102, 241, .25);
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.8px; }
    p { margin: 12px 0 28px; color: #94A3B8; line-height: 1.5; font-size: 15px; }
    button {
      width: 100%; min-height: 54px; border: 0; border-radius: 28px;
      background: #fff; color: #202124; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(.99); }
    #notice { min-height: 40px; margin-top: 16px; color: #94A3B8; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">✦</div>
    <h1>LuminaStudy AI</h1>
    <p>Your focused space to learn, plan, and grow.</p>
    <button type="button" id="googleSignIn">Continue with Google</button>
    <div id="notice" role="status"></div>
  </main>
  <script>
    document.getElementById("googleSignIn").addEventListener("click", function () {
      document.getElementById("notice").textContent =
        "The design is ready. Google Sign-In needs Firebase setup before it can authenticate users.";
    });
  </script>
</body>
</html>
