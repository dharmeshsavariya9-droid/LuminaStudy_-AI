<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1117">
  <title>LuminaStudy AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #0F1117; color: #F8FAFC;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel { width: 100%; max-width: 380px; text-align: center; }
    .logo {
      width: 82px; height: 82px; margin: 0 auto 20px; border-radius: 26px;
      display: grid; place-items: center; font-size: 42px;
      background: linear-gradient(135deg, #4285F4, #8B5CF6, #06B6D4);
      box-shadow: 0 0 42px rgba(99, 102, 241, .25);
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.8px; }
    p { color: #94A3B8; line-height: 1.5; }
    .tagline { margin: 12px 0 28px; }
    button {
      width: 100%; min-height: 54px; border: 0; border-radius: 28px;
      background: #fff; color: #202124; font-size: 16px; font-weight: 600;
      cursor: pointer; padding: 12px 18px;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .secondary { margin-top: 12px; background: #242938; color: #F8FAFC; }
    #status { min-height: 44px; margin-top: 16px; font-size: 13px; color: #94A3B8; overflow-wrap: anywhere; }
    #workspace { display: none; }
    .welcome { margin: 24px 0; padding: 18px; border: 1px solid #303747; border-radius: 16px; background: #171C27; }
    .small { font-size: 13px; color: #94A3B8; }
  </style>
</head>
<body>
  <main class="panel">
    <section id="login">
      <div class="logo" aria-hidden="true">✦</div>
      <h1>LuminaStudy AI</h1>
      <p class="tagline">Your focused space to learn, plan, and grow.</p>
      <button id="googleButton" type="button">Continue with Google</button>
      <div id="status" role="status">Sign in to continue.</div>
    </section>

    <section id="workspace">
      <div class="logo" aria-hidden="true">✦</div>
      <h1>LuminaStudy AI</h1>
      <div class="welcome">
        <h2 id="welcomeName">Welcome!</h2>
        <p>You are signed in successfully.</p>
        <p class="small">This is the first workspace placeholder. Study tools and features have not been added yet.</p>
      </div>
      <button class="secondary" id="logoutButton" type="button">Sign out</button>
      <div id="workspaceStatus" class="small"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARZhbi2if1AuSlvMl9lQTXhL_1CrCEh0Q",
      authDomain: "luminastudy-ai.firebaseapp.com",
      projectId: "luminastudy-ai",
      storageBucket: "luminastudy-ai.firebasestorage.app",
      messagingSenderId: "387308758666",
      appId: "1:387308758666:web:680a7c6c8910ca14b2ef73",
      measurementId: "G-NHKGM6K47G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const loginSection = document.getElementById("login");
    const workspaceSection = document.getElementById("workspace");
    const googleButton = document.getElementById("googleButton");
    const status = document.getElementById("status");

    function showError(error) {
      console.error(error);
      const messages = {
        "auth/unauthorized-domain": "This website domain is not authorised in Firebase. Check Authentication → Settings → Authorized domains.",
        "auth/popup-closed-by-user": "The Google sign-in window was closed before finishing. Please try again.",
        "auth/popup-blocked": "Your browser blocked the sign-in window. Allow pop-ups for this site and try again."
      };
      status.textContent = messages[error.code] || `Sign-in failed: ${error.message || error.code || "Please try again."}`;
    }

    googleButton.addEventListener("click", async () => {
      googleButton.disabled = true;
      status.textContent = "Opening Google sign-in...";
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        if (error.code === "auth/popup-blocked") {
          try {
            await signInWithRedirect(auth, provider);
            return;
          } catch (redirectError) {
            showError(redirectError);
          }
        } else {
          showError(error);
        }
      } finally {
        googleButton.disabled = false;
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
        document.getElementById("workspaceStatus").textContent = "";
      } catch (error) {
        document.getElementById("workspaceStatus").textContent = "Sign-out failed. Please try again.";
        console.error(error);
      }
    });

    try {
      await getRedirectResult(auth);
    } catch (error) {
      showError(error);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        workspaceSection.style.display = "block";
        document.getElementById("welcomeName").textContent = `Welcome, ${user.displayName || "student"}!`;
      } else {
        loginSection.style.display = "block";
        workspaceSection.style.display = "none";
      }
    });
  </script>
</body>
</html>
